        .setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;

}

.switch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
}

.slider:before {
    position: absolute;
    content: "";
    height: 26px;
    width: 26px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .4s;
}

input:checked + .slider {
    background-color: #4CAF50;
}

input:checked + .slider:before {
    transform: translateX(26px);
}

.slider.round {
    border-radius: 34px;
}

.slider.round:before {
    border-radius: 50%;
}

    let lastRobloxImageIndex = -1;

    const pickRobloxImage = () => {
        let index = Math.floor(Math.random() * robloxImages.length);
        if (robloxImages.length > 1 && index === lastRobloxImageIndex) {
            index = (index + 1 + Math.floor(Math.random() * (robloxImages.length - 1))) % robloxImages.length;
        }
        lastRobloxImageIndex = index;
        return robloxImages[index];
    };

    const showRandomRobloxImage = container => {
        document.querySelectorAll('.roblox-character-stage').forEach(stage => stage.remove());
        if (!container || !document.body.classList.contains('theme-roblox')) return;

        const artwork = pickRobloxImage();
        const stage = document.createElement('div');
        stage.className = 'roblox-character-stage';
        const image = document.createElement('img');
        image.src = artwork.src;
        image.alt = artwork.name;
        image.decoding = 'async';
        stage.appendChild(image);
        container.prepend(stage);
    };

    const animateExerciseContainer = element => {
        if (!element) return;
        element.classList.remove('exercise-enter');
        void element.offsetWidth;
        element.classList.add('exercise-enter');
    };

    const createConfetti = () => {
        const container = document.getElementById('confetti-container');
        if (!container || container.childElementCount) return;
        const colors = ['#ffd84d', '#ff6f91', '#53d7ba', '#70a1ff', '#ffffff', '#b56cff'];
        for (let index = 0; index < 30; index++) {
            const piece = document.createElement('span');
            piece.className = 'confetti-piece';
            piece.style.setProperty('--x', `${Math.round(Math.random() * 100)}vw`);
            piece.style.setProperty('--delay', `${(Math.random() * -3).toFixed(2)}s`);
            piece.style.setProperty('--duration', `${(2.4 + Math.random() * 2).toFixed(2)}s`);
            piece.style.setProperty('--color', colors[index % colors.length]);
            container.appendChild(piece);
        }
    };

    const showCompletionCelebration = () => {
        const overlay = document.getElementById('completion-celebration');
        const minecraftTheme = document.body.classList.contains('theme-minecraft');
        const robloxTheme = document.body.classList.contains('theme-roblox');
        const message = robloxTheme
            ? (incorrectAnswers === 0
                ? { mascot: '🏆', title: 'Легендарна перемога!', phrase: 'Perfect run! — Ти пройшов рівень без помилок!' }
                : { mascot: '🎮', title: 'Новий рівень відкрито!', phrase: 'Level complete! — Твоя англійська стала сильнішою!' })
            : minecraftTheme
            ? (incorrectAnswers === 0
                ? { mascot: '💎', title: 'Діамантовий результат!', phrase: 'Achievement unlocked! — Жодної помилки!' }
                : { mascot: '⛏️', title: 'Рівень пройдено!', phrase: 'Great crafting! — Ти збудував ще один рівень англійської!' })
            : (incorrectAnswers === 0
                ? { mascot: '👑', title: 'Ідеальний результат!', phrase: 'Perfect score! — Жодної помилки, неймовірно!' }
                : celebrationMessages[Math.floor(Math.random() * celebrationMessages.length)]);

        const mascotElement = document.getElementById('celebration-mascot');
        if (robloxTheme) {
            const artwork = pickRobloxImage();
            mascotElement.innerHTML = '';
            const image = document.createElement('img');
            image.src = artwork.src;
            image.alt = artwork.name;
            mascotElement.appendChild(image);
            mascotElement.removeAttribute('aria-hidden');
            mascotElement.setAttribute('aria-label', artwork.name);
        } else if (minecraftTheme) {
            const character = pickMinecraftCharacter();
            mascotElement.innerHTML = character.svg;
            mascotElement.removeAttribute('aria-hidden');
            mascotElement.setAttribute('aria-label', character.name);
        } else {
            mascotElement.textContent = message.mascot;
            mascotElement.setAttribute('aria-hidden', 'true');
            mascotElement.removeAttribute('aria-label');
        }
        document.getElementById('celebration-title').textContent = message.title;
        document.getElementById('celebration-phrase').textContent = message.phrase;
        document.getElementById('celebration-status').textContent = 'Зберігаємо твій результат…';
        createConfetti();
        overlay.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    };

    const updateCelebrationStatus = text => {
        document.getElementById('celebration-status').textContent = text;
    };

    const hideCompletionCelebration = () => {
        document.getElementById('completion-celebration').classList.add('hidden');
        document.body.style.overflow = '';
    };

    const normalizeTheme = theme => ['minecraft', 'roblox'].includes(theme) ? theme : 'standard';

    const getSavedTheme = name => {
        try {
            return normalizeTheme(localStorage.getItem(`themeSetting_${name || 'guest'}`));
        } catch (error) {
            return 'standard';
        }
    };

    const updateThemePicker = theme => {
        document.querySelectorAll('.theme-option').forEach(button => {
            const selected = button.dataset.theme === theme;
            button.classList.toggle('selected', selected);
            button.setAttribute('aria-checked', String(selected));
        });
    };

    const applyTheme = (theme, save = false) => {
        const selectedTheme = normalizeTheme(theme);
        document.body.classList.toggle('theme-minecraft', selectedTheme === 'minecraft');
        document.body.classList.toggle('theme-roblox', selectedTheme === 'roblox');
        document.body.dataset.theme = selectedTheme;
        updateThemePicker(selectedTheme);

        const activeExercise = [
            'task-module-container',
            'listen-task-module',
            'listen-select-module',
            'translate-task-module'
        ].map(id => document.getElementById(id)).find(element => element && !element.classList.contains('hidden'));
        showRandomMinecraftCharacter(activeExercise);
        showRandomRobloxImage(activeExercise);

        if (save) {
            try {
                localStorage.setItem(`themeSetting_${userName || 'guest'}`, selectedTheme);
            } catch (error) {
                console.error('Не вдалося зберегти тему:', error);
            }
        }
    };

// Функция для получения настройки голоса из кэша
const getUserVoiceSetting = async (userName) => {
    // Проверяем localStorage на наличие сохранённого голоса
    let savedVoice = localStorage.getItem(`voiceSetting_${userName}`);
    if (savedVoice) {
        return savedVoice; // Возвращаем сохранённый голос
    }

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
        // Для iOS ищем приоритетные голоса
        const voices = speechSynthesis.getVoices();
        for (const voiceName of PRIORITY_VOICES) {
            const voice = voices.find(v => v.name === voiceName);
            if (voice) {
                savedVoice = `${voice.lang}|${voice.name}`;
                localStorage.setItem(`voiceSetting_${userName}`, savedVoice);
                return savedVoice;
            }
        }
    }

    // Если голос не найден или не iOS, возвращаем значение по умолчанию
    savedVoice = 'en-GB|default';
    localStorage.setItem(`voiceSetting_${userName}`, savedVoice);
    return savedVoice;
};

const sanitizeHtml = (content) => {
    const template = document.createElement('template');
    template.innerHTML = String(content || '');
    template.content.querySelectorAll('script, iframe, object, embed, style').forEach(node => node.remove());
    template.content.querySelectorAll('*').forEach(node => {
        [...node.attributes].forEach(attribute => {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim().toLowerCase();
            if (name.startsWith('on') || ((name === 'href' || name === 'src') && value.startsWith('javascript:'))) {
                node.removeAttribute(attribute.name);
            }
        });
    });
    return template.innerHTML;
};

    const calculateLevenshteinDistance = (str1, str2) => {
        if (str1.length === 0) return str2.length;
        if (str2.length === 0) return str1.length;

        const matrix = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));

        for (let i = 0; i <= str1.length; i++) matrix[0][i] = i;
        for (let j = 0; j <= str2.length; j++) matrix[j][0] = j;

        for (let j = 1; j <= str2.length; j++) {
            for (let i = 1; i <= str1.length; i++) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                matrix[j][i] = Math.min(
                    matrix[j][i - 1] + 1,
                    matrix[j - 1][i] + 1,
                    matrix[j - 1][i - 1] + indicator
                );
            }
        }
        return matrix[str2.length][str1.length];
    };

    const speakText = async (text) => {
    if (!text || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.rate = AUDIO_RATE;

    const voices = speechSynthesis.getVoices();
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const selectedVoiceValue = await getUserVoiceSetting(userName); // Получаем значение в формате lang|name
    const [selectedLang, selectedVoiceName] = selectedVoiceValue.split('|'); // Разделяем язык и имя

    let selectedVoice = null;

    if (isIOS) {
        // Для iOS сначала пытаемся использовать сохранённый голос
        selectedVoice = voices.find(v => v.name === selectedVoiceName && v.lang === selectedLang);

        // Если сохранённый голос не найден, пробуем приоритетные голоса
        if (!selectedVoice) {
            for (const voiceName of PRIORITY_VOICES) {
                selectedVoice = voices.find(v => v.name === voiceName);
                if (selectedVoice) break;
            }
        }

        // Если приоритетные голоса не найдены, используем любой голос для en-GB
        if (!selectedVoice) {
            selectedVoice = voices.find(v => v.lang === selectedLang) || voices.find(v => v.lang === 'en-GB');
        }
    } else {
        // Для других платформ ищем голос по имени и языку
        selectedVoice = voices.find(v => v.name === selectedVoiceName && v.lang === selectedLang)
            || voices.find(v => v.lang === selectedLang)
            || voices.find(v => v.lang === 'en-GB');
    }

    if (selectedVoice) {
        msg.voice = selectedVoice;
        msg.lang = selectedVoice.lang;
    } else {
        msg.lang = 'en-GB'; // Запасной вариант
    }

    window.speechSynthesis.speak(msg);
};

        setupEventListeners() {

            this.checkBtn.onclick = async () => this.checkAnswer();
        }

        // Загрузка вопроса
        loadQuestion(sourceText, correctAnswer, synonymsStr = '') {
            this.sourceText = sourceText;
            this.correctAnswer = correctAnswer;
            // Разделяем строку синонимов на массив и фильтруем пустые строки
            this.synonyms = synonymsStr.split(' ').filter(Boolean);
            this.userInput.value = '';
            this.container.classList.remove('hidden');
            // Автоматически воспроизводим аудио после небольшой задержки
            setTimeout(() => this.playAudio(), 500);
        }

        // Воспроизведение аудио
        playAudio() {
            speakText(this.sourceText);
        }

        // Вычисление схожести текстов
        calculateSimilarity(userText, targetText) {
            // Функция нормализации текста (убираем знаки препинания и приводим к нижнему регистру)
            const normalize = (text) => text.toLowerCase().trim()
                .replace(/[.,!?«»'"\-]/g, '')
                .replace(/\s+/g, ' ');

            // Нормализация входных данных
            const normalizedUser = normalize(userText);
            const normalizedTarget = normalize(targetText);
            const normalizedSynonyms = this.synonyms.map(s => normalize(s));

            // Разбиваем на слова
            const userWords = normalizedUser.split(' ');
            const targetWords = normalizedTarget.split(' ');

            // Функция для вычисления расстояния Левенштейна между словами
            const levenshteinDistance = (a, b) => {
                return calculateLevenshteinDistance(a, b);
            };

            // Функция для проверки схожести слов с учетом небольших различий
            const areSimilarWords = (word1, word2) => {
                const distance = levenshteinDistance(word1, word2);
                // Допускаем 1 различие для коротких слов (до 5 букв) и 2 различия для длинных слов
                const maxAllowedDistance = word1.length <= 5 ? 1 : 2;
                return distance <= maxAllowedDistance;
            };

            // Функция для проверки наличия синонимов с учетом морфологических форм
            const isSynonymMatch = (word, targetWord) => {
                // Проверяем точное совпадение
                if (word === targetWord) return true;

                // Проверяем синонимы
                for (const synonym of normalizedSynonyms) {
                    const synonymWords = synonym.split(' ');
                    for (const synonymWord of synonymWords) {
                        if (areSimilarWords(word, synonymWord)) return true;
                    }
                }

                // Проверяем похожие слова (учитываем падежи и другие морфологические формы)
                return areSimilarWords(word, targetWord);
            };

            // Вычисление схожести с учетом синонимов и морфологических форм
            let matchedWords = 0;
            let totalWords = Math.max(userWords.length, targetWords.length);

            // Создаем копии массивов для отслеживания использованных слов
            let remainingUserWords = [...userWords];
            let remainingTargetWords = [...targetWords];

            // Проходим по словам и ищем совпадения
            for (let i = 0; i < userWords.length; i++) {
                const userWord = userWords[i];
                for (let j = 0; j < targetWords.length; j++) {
                    if (isSynonymMatch(userWord, targetWords[j])) {
                        matchedWords++;
                        break;
                    }
                }
            }

            // Базовый процент схожести
            let similarity = (matchedWords / totalWords) * 100;

            // Бонусные баллы за использование синонимов
            const usedSynonyms = normalizedSynonyms.some(synonym =>
                userWords.some(word => isSynonymMatch(word, synonym))
            );
            if (usedSynonyms) {
                similarity += 10; // Добавляем 10% за правильное использование синонимов
            }

            // Бонус за сохранение смысла при небольших грамматических различиях
            if (similarity >= 70) {
                const mainWordsMatch = targetWords
                    .filter(word => word.length > 3)
                    .every(word => userWords.some(userWord => isSynonymMatch(userWord, word)));
                if (mainWordsMatch) {
                    similarity += 10; // Добавляем еще 10% за сохранение основного смысла
                }
            }

            // Ограничиваем максимальное значение до 100%
            return Math.min(Math.round(similarity), 100);
        }

        // Воспроизведение звука правильного ответа
        playCorrectSound() {
            speakText("You're right!");
        }

        // Проверка ответа
        async checkAnswer() {
            if (answerTransitionInProgress) return;
            const userAnswer = this.userInput.value;
            const similarity = this.calculateSimilarity(userAnswer, this.correctAnswer);
            const isCorrect = similarity >= TRANSLATION_SIMILARITY_THRESHOLD;

            if (isCorrect) {
                answerTransitionInProgress = true;
                if (previousIncorrect) {
                    correctAfterIncorrect++;
                    previousIncorrect = false;
                } else {
                    correctAnswers++;
                }

                displayFeedback(`Правильно! Схожість: ${similarity.toFixed(1)}%`, this.correctAnswer, true);
                this.playCorrectSound(); // Добавлено воспроизведение звука правильного ответа
                this.container.classList.add('hidden');

                previousIncorrect = true;
                displayFeedback(`Відповідь неправильна 😕 (${similarity.toFixed(1)}%), спробуйте ще раз.`, '', false);
                playWrongSound();
            }
            updateProgressBar();
            updateStats();
            saveProgress(isCorrect ? currentIndex + 1 : currentIndex);
        }
    }

        // Загрузка вопроса
        loadQuestion(taskText, correctAnswer, distractors) {
            this.correctAnswer = correctAnswer;
            this.userAnswer = [];
            this.taskTextElem.innerText = taskText;
            this.clearWordsContainer();

            // Разбиваем correctAnswer на слова
            const correctWords = correctAnswer.split(' ');

            // Используем distractors напрямую, так как они уже являются массивом
            const distractorWords = Array.isArray(distractors) ? distractors : [];

            // Объединяем правильные слова и дистракторы
            this.populateWords(correctWords, distractorWords);

            this.container.classList.remove('hidden');
            this.userAnswerElem.classList.remove('hidden');
            this.playAudio();
        }

        // Очистка контейнера слов
        clearWordsContainer() {
            this.wordsContainer.innerHTML = '';
            this.userAnswerElem.innerText = '';
        }

        // Заполнение слов
        populateWords(correctWords, distractorWords) {
            // Объединяем все слова в один массив
            const allWords = [...correctWords, ...distractorWords];

            // Перемешиваем слова
            const shuffledWords = allWords.sort(() => 0.5 - Math.random());

            // Создаем элементы для каждого слова
            shuffledWords.forEach(word => {
                const span = document.createElement('span');
                span.innerText = word.replace(/_/g, ' ');
                span.className = 'word';
                span.onclick = () => {
                    if (!span.classList.contains('clicked')) {
                        this.userAnswer.push(word);
                        span.classList.add('clicked');
                        this.updateUserAnswerDisplay();
                    }
                };
                this.wordsContainer.appendChild(span);
            });
        }

        // Обновление отображения ответа пользователя
        updateUserAnswerDisplay() {
            this.userAnswerElem.innerText = this.userAnswer.join(' ').replace(/_/g, ' ');
        }

        // Сброс вопроса
        resetQuestion() {
            this.userAnswer = [];
            this.updateUserAnswerDisplay();
            const words = this.wordsContainer.querySelectorAll('.word');
            words.forEach(word => word.classList.remove('clicked'));
        }

        // Воспроизведение аудио
        playAudio() {
            speakText(this.correctAnswer);
        }

        // Воспроизведение звука правильного ответа
        playCorrectSound() {
            speakText("You're right!");
        }

        // Проверка ответа
        checkAnswer() {
            const normalizeText = (text) => text.trim().toLowerCase()
                .replace(/_/g, ' ')
                .replace(/[.,?]/g, '')
                .replace(/\s+/g, ' ');
            const userAnswerStr = normalizeText(this.userAnswer.join(' '));
            const normalizedCorrectAnswer = normalizeText(this.correctAnswer);
            return userAnswerStr === normalizedCorrectAnswer;
        }
    }

        overlay.style.display = 'block';
        notification.style.display = 'block';

        document.querySelector('.notification-close-btn').onclick = hideNotification;
    };

   // Скрытие уведомления и очистка ячейки в столбце C
        const hideNotification = async () => {
            const overlay = document.querySelector('.overlay');
            const notification = document.getElementById('user-notification');
            
            // Отправляем запрос на очистку ячейки в столбце C
            try {
                const data = {
                    action: 'clearNotification',
                    userName: userName
                };

                const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(data)
                });

                console.log('Запрос на очистку уведомления отправлен');
            } catch (err) {
                console.error('Ошибка при отправке запроса на очистку уведомления:', err);
            }

            // Скрываем уведомление и оверлей
            overlay.style.display = 'none';
            notification.style.display = 'none';
        };

    // Компонент еженедельного прогресса
    const WeeklyProgress = () => {
        const [progress, setProgress] = React.useState([]);
        const days = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'НД'];

        const today = new Date().getDay();
        const currentDayIndex = today === 0 ? 6 : today - 1;

        React.useEffect(() => {
            const fetchProgress = async () => {
                const userName = localStorage.getItem('userName');
                if (!userName) return;

                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/users!A:K?key=${API_KEY}`;

                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    const userRow = data.values.find(row => row[0] === userName);

                    if (userRow) {
                        const currentSheetName = userRow[1];
                        const isTaskSheet = currentSheetName && (
                            currentSheetName.startsWith('listen-select_') ||
                            currentSheetName.startsWith('listen_') ||
                            !currentSheetName.includes('_off')
                        );

                        const weekProgress = userRow.slice(4, 11).map((cell, index) =>
                            index === currentDayIndex && isTaskSheet ? true : !!cell
                        );
                        setProgress(weekProgress);
                    }
                } catch (error) {
                    console.error('Error fetching progress:', error);
                    const defaultProgress = Array(7).fill(false);
                    defaultProgress[currentDayIndex] = false;
                    setProgress(defaultProgress);
                }
            };

            fetchProgress();
        }, [currentDayIndex]);

        return React.createElement('div', null,
            React.createElement('div', { className: 'weekly-progress mt-4' },
                React.createElement('h3', { className: 'text-center mb-4' }, 'Ваш тижневий прогрес'),
                React.createElement('div', { className: 'grid grid-cols-7 gap-2 text-center' },
                    days.map((day, index) =>
                        React.createElement('div', {
                            key: day,
                            className: `flex flex-col items-center ${index === currentDayIndex ? 'today-cell' : ''}`
                        },
                            React.createElement('div', {
                                className: `font-medium mb-2 ${index === currentDayIndex ? 'today-text' : ''}`
                            }, day),
                            React.createElement('div', { className: 'text-2xl' },
                                progress[index] ? '✅' : '❌'
                            )
                        )
                    )
                )
            ),
            React.createElement(RatingTable)
        );
    };

    // Обработчик загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        const inputField = document.getElementById('speak-user-input');
        const clearBtn = document.getElementById('clear-btn');
        const nameInput = document.getElementById('name-input');

        nameInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') document.getElementById('start-btn').click();
        });

        // Показать крестик, если поле заполнено
        if (inputField) {
            inputField.addEventListener('input', () => {
                if (inputField.value.length > 0) {
                    clearBtn.style.display = 'block';
                } else {
                    clearBtn.style.display = 'none';
                }
            });

            // Очистка поля при нажатии на крестик
            clearBtn.addEventListener('click', () => {
                inputField.value = '';
                clearBtn.style.display = 'none';
                inputField.focus();
            });
        }

        // Инициализация других модулей
        if (document.getElementById('task-module-container')) {
            taskModule = new TaskModule(
                'task-module-container',
                'ukr-sentence',
                'english-words-container',
                'user-answer',
                'check-btn',
                'reset-btn',
                'hint-btn'
            );
        }

        if (document.getElementById('listen-task-module')) {
            listenTaskModule = new ListenTaskModule(
                'listen-task-module',
                'play-audio-btn',
                'listen-task-text',
                'listen-user-input',
                'listen-check-btn'
            );
        }

        if (document.getElementById('listen-select-module')) {
            listenSelectTaskModule = new ListenSelectTaskModule(
                'listen-select-module'
            );
        }

        if (document.getElementById('translate-task-module')) {
            translateTaskModule = new TranslateTaskModule(
                'translate-task-module'
            );
        }

                        if (document.getElementById('check-btn')) {
            document.getElementById('check-btn').onclick = async () => {
                if (answerTransitionInProgress || !taskModule) return;
                const isCorrect = taskModule.checkAnswer();
                if (isCorrect) {
                    answerTransitionInProgress = true;
                    if (previousIncorrect) {
                        correctAfterIncorrect++;
                        previousIncorrect = false;
                    } else {
                        correctAnswers++;
                    }
                    displayFeedback('Правильно!', taskModule.correctAnswer, true);
                    playCorrectAnswer(taskModule.correctAnswer);
                    document.getElementById('task-module-container').classList.add('hidden');
                    // Добавляем обновление статистики
                    updateStats();
                    saveProgress(currentIndex + 1);
                    setTimeout(async () => {
                        currentIndex++;
                        if (currentIndex < values.length) {
                            document.getElementById('feedback').classList.add('hidden');
                            document.getElementById('correct-answer').classList.add('hidden');
                            await loadQuestion(currentIndex, sheetName);
                        } else {
                            completeModule();
                        }
                    }, 3000);
                } else {
                    incorrectAnswers++;
                    previousIncorrect = true;
                    taskModule.errorCount++;
                    console.log('Error count after increment:', taskModule.errorCount);
                    displayFeedback('Відповідь неправильна 😕, спробуйте ще раз.', '', false);
                    playWrongSound();
                    if (taskModule.errorCount >= ERROR_COUNT_ANSWER) {
                        taskModule.showHintText();
                    }
                    updateProgressBar();
                    updateStats();
                    saveProgress(currentIndex);
                }
            };
        }

        if (document.getElementById('listen-check-btn')) {
            document.getElementById('listen-check-btn').onclick = async () => {
                if (answerTransitionInProgress || !listenTaskModule) return;
                const isCorrect = listenTaskModule.checkAnswer();
                if (isCorrect) {
                    answerTransitionInProgress = true;
                    if (previousIncorrect) {
                        correctAfterIncorrect++;
                        previousIncorrect = false;
                    } else {
                        correctAnswers++;
                    }
                    displayFeedback('Правильно!', listenTaskModule.correctAnswer, true);
                    listenTaskModule.playCorrectSound();
                    document.getElementById('listen-task-module').classList.add('hidden');
                    setTimeout(async () => {
                        currentIndex++;
                        if (currentIndex < values.length) {
                            document.getElementById('feedback').classList.add('hidden');
                            document.getElementById('correct-answer').classList.add('hidden');
                            document.getElementById('listen-task-module').classList.remove('hidden');
                            await loadQuestion(currentIndex, sheetName);
                        } else {
                            completeModule();
                        }
                    }, 3000);
                } else {
                    incorrectAnswers++;
                    previousIncorrect = true;
                    displayFeedback('Відповідь неправильна😕, спробуйте ще раз.', '', false);
                    playWrongSound();
                }
                updateProgressBar();
                updateStats();
                saveProgress(isCorrect ? currentIndex + 1 : currentIndex);
            };
        }

        // Обработчик загрузки страницы
        window.onload = () => {
            fetchAdminData();
            
            const savedUserName = localStorage.getItem('userName');
            if (savedUserName) {
                userName = savedUserName;
                applyTheme(getSavedTheme(userName));
                document.querySelector('.user-info').classList.remove('hidden');
                document.querySelector('.burger-menu').classList.remove('hidden');
                document.getElementById('name-input-container').style.display = 'none';
                document.querySelector('.separator').classList.remove('hidden');
                fetchUserSheet(); // Это установит правильное приветствие из листа
            }
        };

        // Обработчик клика на оверлей
        document.querySelector('.overlay').onclick = hideNotification;

        // Обработчик клика на бургер-меню
        document.querySelector('.burger-icon').addEventListener('click', function() {
            document.querySelector('.side-panel').style.width = '85%';
        });

        // Обработчик клика на кнопку закрытия боковой панели
        document.querySelector('.side-panel .close-btn').addEventListener('click', function() {
            document.querySelector('.side-panel').style.width = '0';
        });
    });
</script>

</body>
</html>
