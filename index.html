        .setting-item {
    display: flex;
    justify-content: space-between;
    align-items: center;

}

.switch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
}

.slider:before {
    position: absolute;
    content: "";
    height: 26px;
    width: 26px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    transition: .4s;
}

input:checked + .slider {
    background-color: #4CAF50;
}

input:checked + .slider:before {
    transform: translateX(26px);
}

.slider.round {
    border-radius: 34px;
}

.slider.round:before {
    border-radius: 50%;
}

const getUserVoiceSetting = async (userName) => {
    // Проверяем localStorage на наличие сохранённого голоса
    let savedVoice = localStorage.getItem(`voiceSetting_${userName}`);
    if (savedVoice) {
        return savedVoice; // Возвращаем сохранённый голос
    }

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
        // Для iOS ищем приоритетные голоса
        const voices = speechSynthesis.getVoices();
        for (const voiceName of PRIORITY_VOICES) {
            const voice = voices.find(v => v.name === voiceName);
            if (voice) {
                savedVoice = `${voice.lang}|${voice.name}`;
                localStorage.setItem(`voiceSetting_${userName}`, savedVoice);
                return savedVoice;
            }
        }
    }

    // Если голос не найден или не iOS, возвращаем значение по умолчанию
    savedVoice = 'en-GB|default';
    localStorage.setItem(`voiceSetting_${userName}`, savedVoice);
    return savedVoice;
};

const sanitizeHtml = (content) => {
    const template = document.createElement('template');
    template.innerHTML = String(content || '');
    template.content.querySelectorAll('script, iframe, object, embed, style').forEach(node => node.remove());
    template.content.querySelectorAll('*').forEach(node => {
        [...node.attributes].forEach(attribute => {
            const name = attribute.name.toLowerCase();
            const value = attribute.value.trim().toLowerCase();
            if (name.startsWith('on') || ((name === 'href' || name === 'src') && value.startsWith('javascript:'))) {
                node.removeAttribute(attribute.name);
            }
        });
    });
    return template.innerHTML;
};

    const calculateLevenshteinDistance = (str1, str2) => {
        if (str1.length === 0) return str2.length;
        if (str2.length === 0) return str1.length;

        const matrix = Array(str2.length + 1).fill(null).map(() => Array(str1.length + 1).fill(null));

        for (let i = 0; i <= str1.length; i++) matrix[0][i] = i;
        for (let j = 0; j <= str2.length; j++) matrix[j][0] = j;

        for (let j = 1; j <= str2.length; j++) {
            for (let i = 1; i <= str1.length; i++) {
                const indicator = str1[i - 1] === str2[j - 1] ? 0 : 1;
                matrix[j][i] = Math.min(
                    matrix[j][i - 1] + 1,
                    matrix[j - 1][i] + 1,
                    matrix[j - 1][i - 1] + indicator
                );
            }
        }
        return matrix[str2.length][str1.length];
    };

        setupEventListeners() {

        }

        // Загрузка вопроса
        loadQuestion(sourceText, correctAnswer, synonymsStr = '') {
            this.sourceText = sourceText;
            this.correctAnswer = correctAnswer;
            // Разделяем строку синонимов на массив и фильтруем пустые строки
            this.synonyms = synonymsStr.split(' ').filter(Boolean);
            this.userInput.value = '';
            this.container.classList.remove('hidden');
            // Автоматически воспроизводим аудио после небольшой задержки
            setTimeout(() => this.playAudio(), 500);
        }

        // Воспроизведение аудио
        playAudio() {
            speakText(this.sourceText);
        }

        // Вычисление схожести текстов
        calculateSimilarity(userText, targetText) {
            // Функция нормализации текста (убираем знаки препинания и приводим к нижнему регистру)
            const normalize = (text) => text.toLowerCase().trim()
                .replace(/[.,!?«»'"\-]/g, '')
                .replace(/\s+/g, ' ');

            // Нормализация входных данных
            const normalizedUser = normalize(userText);
            const normalizedTarget = normalize(targetText);
            const normalizedSynonyms = this.synonyms.map(s => normalize(s));

            // Разбиваем на слова
            const userWords = normalizedUser.split(' ');
            const targetWords = normalizedTarget.split(' ');

            // Функция для вычисления расстояния Левенштейна между словами
            const levenshteinDistance = (a, b) => {
                return calculateLevenshteinDistance(a, b);
            };

            // Функция для проверки схожести слов с учетом небольших различий
            const areSimilarWords = (word1, word2) => {
                const distance = levenshteinDistance(word1, word2);
                // Допускаем 1 различие для коротких слов (до 5 букв) и 2 различия для длинных слов
                const maxAllowedDistance = word1.length <= 5 ? 1 : 2;
                return distance <= maxAllowedDistance;
            };

            // Функция для проверки наличия синонимов с учетом морфологических форм
            const isSynonymMatch = (word, targetWord) => {
                // Проверяем точное совпадение
                if (word === targetWord) return true;

                // Проверяем синонимы
                for (const synonym of normalizedSynonyms) {
                    const synonymWords = synonym.split(' ');
                    for (const synonymWord of synonymWords) {
                        if (areSimilarWords(word, synonymWord)) return true;
                    }
                }

                // Проверяем похожие слова (учитываем падежи и другие морфологические формы)
                return areSimilarWords(word, targetWord);
            };

            // Вычисление схожести с учетом синонимов и морфологических форм
            let matchedWords = 0;
            let totalWords = Math.max(userWords.length, targetWords.length);

            // Создаем копии массивов для отслеживания использованных слов
            let remainingUserWords = [...userWords];
            let remainingTargetWords = [...targetWords];

            // Проходим по словам и ищем совпадения
            for (let i = 0; i < userWords.length; i++) {
                const userWord = userWords[i];
                for (let j = 0; j < targetWords.length; j++) {
                    if (isSynonymMatch(userWord, targetWords[j])) {
                        matchedWords++;
                        break;
                    }
                }
            }

            // Базовый процент схожести
            let similarity = (matchedWords / totalWords) * 100;

            // Бонусные баллы за использование синонимов
            const usedSynonyms = normalizedSynonyms.some(synonym =>
                userWords.some(word => isSynonymMatch(word, synonym))
            );
            if (usedSynonyms) {
                similarity += 10; // Добавляем 10% за правильное использование синонимов
            }

            // Бонус за сохранение смысла при небольших грамматических различиях
            if (similarity >= 70) {
                const mainWordsMatch = targetWords
                    .filter(word => word.length > 3)
                    .every(word => userWords.some(userWord => isSynonymMatch(userWord, word)));
                if (mainWordsMatch) {
                    similarity += 10; // Добавляем еще 10% за сохранение основного смысла
                }
            }

            // Ограничиваем максимальное значение до 100%
            return Math.min(Math.round(similarity), 100);
        }

        // Воспроизведение звука правильного ответа
        playCorrectSound() {
            speakText("You're right!");
        }

        // Проверка ответа
        async checkAnswer() {
            if (answerTransitionInProgress) return;
            const userAnswer = this.userInput.value;
            const similarity = this.calculateSimilarity(userAnswer, this.correctAnswer);
            const isCorrect = similarity >= TRANSLATION_SIMILARITY_THRESHOLD;

                if (previousIncorrect) {

            const response = await fetch(url);
            const data = await response.json();
            const adminValues = data.values;
            if (adminValues.length >= 1) {
                document.getElementById('page-title').innerText = adminValues[0][0];
            }
        } catch (err) {
            console.error('Помилка отримання даних адміністратора:', err);
        }
    };

    // Получение данных
const fetchData = async (sheetName) => {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${sheetName}!A:D?key=${API_KEY}`;
    try {
        // Показываем task-module-container и loading-task
        const taskContainer = document.getElementById('task-module-container');
        const loadingTask = document.getElementById('loading-task');
        hidePreviousExercise();
        taskContainer.classList.remove('hidden');
        loadingTask.classList.remove('hidden');
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Google Sheets: HTTP ${response.status}`);
        const data = await response.json();
        const loadedRows = Array.isArray(data.values)
            ? data.values.slice(1).filter(row => row && row[0] && row[1])
            : [];
        if (loadedRows.length > 0) {
            values = loadedRows;
            fetchHintImageUrl(sheetName);
            loadProgressOrQuestion(sheetName);
        } else {
            throw new Error('Завдань не знайдено');
        }
    } catch (err) {
        console.error('Помилка отримання даних:', err);
        document.getElementById('feedback').innerText = 'Завдань не знайдено';
        document.getElementById('feedback').classList.remove('hidden');
        document.getElementById('check-btn').classList.add('hidden');
        document.getElementById('reset-btn').classList.add('hidden');
        document.getElementById('hint-btn').classList.add('hidden');
        // Скрываем loading-task при ошибке
        document.getElementById('loading-task').classList.add('hidden');
    }
};

    // Получение листа пользователя
    const fetchUserSheet = async () => {
    // Сначала скрываем points-container
    document.getElementById('points-container').style.display = 'none';

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${USERS_RANGE}?key=${API_KEY}`;
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Google Sheets: HTTP ${response.status}`);
        const data = await response.json();
        const users = Array.isArray(data.values) ? data.values.slice(1) : [];
        const user = users.find(row => row[0] === userName);
        if (user) {
            let userSheet = user[1] ? user[1] : "day_off";
            points = user[12];
            const customGreeting = user[3] ? user[3] + " " : "";
            document.getElementById('user-name').innerText = `${customGreeting}${userName}`;

            // Получаем пункты бургер-меню из столбца Q
            const menuItems = user[16] ? user[16].split(';').map(item => item.trim()) : [];

            // Управляем видимостью бургер-меню
            const burgerMenu = document.querySelector('.burger-menu');
            if (menuItems.length > 0 && menuItems[0] !== '') {
                burgerMenu.classList.remove('hidden'); // Показываем бургер-меню
            } else {
                burgerMenu.classList.add('hidden'); // Скрываем бургер-меню
            }

            // Обновляем бургер-меню
            updateBurgerMenu(menuItems);

            // Проверяем, является ли лист tasklist-ом
            if (userSheet.startsWith('tasklist_')) {
                const firstSheet = await handleTaskList(userSheet);
                if (firstSheet) {
                    sheetName = firstSheet;
                } else {
                    sheetName = "day_off";
                }
            } else {
                isTaskList = false;
                sheetName = userSheet;
            }
            fetchData(sheetName);
            if (user[2]) {
                showNotification(user[2]);
            }

            // Проверяем наличие листа подарков
            const presentsUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/present-${userName}!A:C?key=${API_KEY}`;
            try {
                const presentsResponse = await fetch(presentsUrl);
                const presentsData = await presentsResponse.json();
                if (!presentsData.error) {
                    // Только если лист подарков существует, показываем points
                    document.getElementById('points-container').style.display = 'flex';
                    document.getElementById('points-badge').innerText = `${points}`;
                }
            } catch (err) {
                console.error('Помилка отримання даних present:', err);
            }
        } else {
            cleanupUI();
            const feedbackElement = document.getElementById('feedback');
            feedbackElement.innerText = 'Вас немає в системі. Зверніться до адміністратора';
            feedbackElement.classList.remove('hidden');
            // Скрываем бургер-меню, если пользователь не найден
            document.querySelector('.burger-menu').classList.add('hidden');
        }
    } catch (err) {
        console.error('Помилка отримання даних користувача:', err);
        cleanupUI();
        const feedbackElement = document.getElementById('feedback');
        feedbackElement.innerText = 'Не вдалося завантажити дані. Перевірте інтернет і оновіть сторінку.';
        feedbackElement.classList.remove('hidden');
        // Скрываем бургер-меню в случае ошибки
        document.querySelector('.burger-menu').classList.add('hidden');
    }
};

    // Загрузка прогресса или вопроса
    const loadProgressOrQuestion = (sheetName) => {
        const savedProgress = localStorage.getItem(getProgressKey(userName, sheetName));

        if (savedProgress) {
            let progress;
            try {
                progress = JSON.parse(savedProgress);
            } catch (error) {
                localStorage.removeItem(getProgressKey(userName, sheetName));
                loadQuestion(currentIndex, sheetName);
                return;
            }
            if (progress.completed) {
                currentIndex = values.length;
                correctAnswers = Number(progress.correctAnswers) || 0;
                incorrectAnswers = Number(progress.incorrectAnswers) || 0;
                correctAfterIncorrect = Number(progress.correctAfterIncorrect) || 0;
                previousIncorrect = Boolean(progress.previousIncorrect);
                resultSubmissionId = String(progress.submissionId || '');
                completeModule();
            } else {
                // Відновлюємо саме те завдання, яке ще не було завершене.
                currentIndex = Math.max(0, Number(progress.currentIndex) || 0);
                correctAnswers = progress.correctAnswers || 0;
                incorrectAnswers = progress.incorrectAnswers || 0;
                correctAfterIncorrect = progress.correctAfterIncorrect || 0;
                previousIncorrect = progress.previousIncorrect || false;
                resultSubmissionId = String(progress.submissionId || '');
                
                // Проверяем, не превышает ли currentIndex количество заданий
                if (currentIndex >= values.length) {
                    completeModule();
                    return;
                }
                
                loadQuestion(currentIndex, sheetName);
                updateStats();
            }
        } else {
            loadQuestion(currentIndex, sheetName);
        }
    };

    // Открытие модального окна подсказки
    const openHintModal = () => {
        const hintModal = document.getElementById('hint-modal');
        const hintImage = document.getElementById('hint-image');
        hintImage.src = hintImageUrl;
        hintImage.alt = "Hint Image";
        hintModal.classList.remove('hidden');
        hintModal.style.display = 'flex';
        console.log('Hint Image URL in Modal:', this.hintImageUrl);
    };

    // Закрытие модального окна подсказки
    const closeHintModal = () => {
        const hintModal = document.getElementById('hint-modal');
        hintModal.style.display = 'none';
    };

    // Открытие модального окна очков
    const openPointsModal = async () => {
        const userNameSheet = `present-${userName}`;
        const pointsModal = document.getElementById('points-modal');
        const pointsDetail = document.getElementById('points-detail');
        const adminText = document.getElementById('admin-text');
        const giftsContainer = document.getElementById('gifts-container');

        pointsDetail.querySelector('#points').innerText = points;

        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/admin!B4?key=${API_KEY}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.values && data.values.length > 0 && data.values[0][0]) {
                adminText.innerText = data.values[0][0];
            }
        } catch (err) {
            console.error('Помилка отримання даних admin:', err);
        }

        const presentsUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${userNameSheet}!A:C?key=${API_KEY}`;
        try {
            const response = await fetch(presentsUrl);
            const data = await response.json();
            if (data.values && data.values.length > 0) {
                giftsContainer.innerHTML = '';
                data.values.slice(1).forEach(present => {
                    const giftItem = document.createElement('div');
                    giftItem.className = 'gift-item';
                    const image = document.createElement('img');
                    image.src = String(present[2] || '');
                    image.alt = String(present[0] || 'Подарунок');
                    const title = document.createElement('div');
                    title.textContent = String(present[0] || '');
                    const price = document.createElement('div');
                    price.textContent = `${present[1] || 0} coins`;
                    giftItem.append(image, title, price);
                    giftsContainer.appendChild(giftItem);
                });
                pointsModal.classList.remove('hidden');
                pointsModal.style.display = 'flex';
            }
        } catch (err) {
            console.error('Помилка отримання даних present:', err);
        }
    };

    // Закрытие модального окна очков
    const closePointsModal = () => {
        const pointsModal = document.getElementById('points-modal');
        pointsModal.style.display = 'none';
    };

    // Обработчик клика на контейнер очков
    document.getElementById('points-container').onclick = () => {
        openPointsModal();
    };

    // Обработчики клика на кнопки закрытия
    document.querySelectorAll('.close-btn').forEach(btn => {
        btn.onclick = () => {
            closeHintModal();
            closePointsModal();
        };
    });

    // Обработчик клика на окно
    window.addEventListener('click', (event) => {
        const hintModal = document.getElementById('hint-modal');
        const pointsModal = document.getElementById('points-modal');
        if (event.target === hintModal) {
            closeHintModal();
        }
        if (event.target === pointsModal) {
            closePointsModal();
        }
    });

    // Обработчик клика на кнопку начала
    document.getElementById('start-btn').onclick = () => {
    // Получаем значение поля ввода и нормализуем его
    let inputValue = document.getElementById('name-input').value;
    userName = inputValue.trim().replace(/\s+/g, ' '); // Удаляем лишние пробелы
    if (userName) {
        localStorage.setItem('userName', userName);
        applyTheme(getSavedTheme(userName));
        document.getElementById('user-name').innerText = `${userName}`;
        document.querySelector('.user-info').classList.remove('hidden');
        document.getElementById('name-input-container').style.display = 'none';
        document.querySelector('.separator').classList.remove('hidden');
        document.querySelector('.burger-menu').classList.remove('hidden');

        const feedbackElement = document.getElementById('feedback');
        feedbackElement.innerText = '';
        feedbackElement.classList.add('hidden');

        document.getElementById('task-module-container').classList.remove('hidden');
        document.getElementById('listen-task-module').classList.add('hidden');
        document.getElementById('correct-answer').classList.remove('hidden');
        fetchAdminData();
        fetchUserSheet();
    } else {
        alert('Введіть ваше ім\'я.');
    }
};

    // Обработчик клика на кнопку выхода
    document.querySelector('.logout-btn').onclick = () => {
        localStorage.removeItem('userName');
        clearProgress();
        document.querySelector('.user-info').classList.add('hidden');
        document.getElementById('name-input-container').style.display = 'flex';
        document.querySelector('.separator').classList.add('hidden');
        document.getElementById('task-module-container').classList.add('hidden');
        document.getElementById('listen-task-module').classList.add('hidden');
        document.getElementById('feedback').classList.add('hidden');
        document.getElementById('correct-answer').classList.add('hidden');
        document.getElementById('stats-container').classList.add('hidden');
        location.reload();
    };

    // Показ индикатора загрузки
    const showLoadingIndicator = () => {
        document.getElementById('loading-indicator').style.display = 'block';
    };

    // Скрытие индикатора загрузки
    const hideLoadingIndicator = () => {
        document.getElementById('loading-indicator').style.display = 'none';
    };

    // Показ уведомления
    const showNotification = (message) => {
        const overlay = document.querySelector('.overlay');
        const notification = document.getElementById('user-notification');
        notification.textContent = String(message || '');
        const closeButton = document.createElement('span');
        closeButton.className = 'notification-close-btn';
        closeButton.setAttribute('role', 'button');
        closeButton.setAttribute('aria-label', 'Закрити повідомлення');
        closeButton.textContent = '×';
        notification.append(' ', closeButton);
        overlay.style.display = 'block';
        notification.style.display = 'block';

        document.querySelector('.notification-close-btn').onclick = hideNotification;
    };

   // Скрытие уведомления и очистка ячейки в столбце C
        const hideNotification = async () => {
            const overlay = document.querySelector('.overlay');
            const notification = document.getElementById('user-notification');
            
            // Отправляем запрос на очистку ячейки в столбце C
            try {
                const data = {
                    action: 'clearNotification',
                    userName: userName
                };

                const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(data)
                });

                console.log('Запрос на очистку уведомления отправлен');
            } catch (err) {
                console.error('Ошибка при отправке запроса на очистку уведомления:', err);
            }

            // Скрываем уведомление и оверлей
            overlay.style.display = 'none';
            notification.style.display = 'none';
        };

    // Компонент еженедельного прогресса
    const WeeklyProgress = () => {
        const [progress, setProgress] = React.useState([]);
        const days = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'НД'];

        const today = new Date().getDay();
        const currentDayIndex = today === 0 ? 6 : today - 1;

        React.useEffect(() => {
            const fetchProgress = async () => {
                const userName = localStorage.getItem('userName');
                if (!userName) return;

                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/users!A:K?key=${API_KEY}`;

                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    const userRow = data.values.find(row => row[0] === userName);

                    if (userRow) {
                        const currentSheetName = userRow[1];
                        const isTaskSheet = currentSheetName && (
                            currentSheetName.startsWith('listen-select_') ||
                            currentSheetName.startsWith('listen_') ||
                            !currentSheetName.includes('_off')
                        );

                        const weekProgress = userRow.slice(4, 11).map((cell, index) =>
                            index === currentDayIndex && isTaskSheet ? true : !!cell
                        );
                        setProgress(weekProgress);
                    }
                } catch (error) {
                    console.error('Error fetching progress:', error);
                    const defaultProgress = Array(7).fill(false);
                    defaultProgress[currentDayIndex] = false;
                    setProgress(defaultProgress);
                }
            };

            fetchProgress();
        }, [currentDayIndex]);

        return React.createElement('div', null,
            React.createElement('div', { className: 'weekly-progress mt-4' },
                React.createElement('h3', { className: 'text-center mb-4' }, 'Ваш тижневий прогрес'),
                React.createElement('div', { className: 'grid grid-cols-7 gap-2 text-center' },
                    days.map((day, index) =>
                        React.createElement('div', {
                            key: day,
                            className: `flex flex-col items-center ${index === currentDayIndex ? 'today-cell' : ''}`
                        },
                            React.createElement('div', {
                                className: `font-medium mb-2 ${index === currentDayIndex ? 'today-text' : ''}`
                            }, day),
                            React.createElement('div', { className: 'text-2xl' },
                                progress[index] ? '✅' : '❌'
                            )
                        )
                    )
                )
            ),
            React.createElement(RatingTable)
        );
    };

    // Обработчик загрузки DOM
    document.addEventListener('DOMContentLoaded', () => {
        const inputField = document.getElementById('speak-user-input');
        const clearBtn = document.getElementById('clear-btn');
        const nameInput = document.getElementById('name-input');

        nameInput.addEventListener('keydown', event => {
            if (event.key === 'Enter') document.getElementById('start-btn').click();
        });

        // Показать крестик, если поле заполнено
        if (inputField) {
            inputField.addEventListener('input', () => {
                if (inputField.value.length > 0) {
                    clearBtn.style.display = 'block';
                } else {
                    clearBtn.style.display = 'none';
                }
            });

            // Очистка поля при нажатии на крестик
            clearBtn.addEventListener('click', () => {
                inputField.value = '';
                clearBtn.style.display = 'none';
                inputField.focus();
            });
        }

        // Инициализация других модулей
        if (document.getElementById('task-module-container')) {
            taskModule = new TaskModule(
                'task-module-container',
                'ukr-sentence',
                'english-words-container',
                'user-answer',
                'check-btn',
                'reset-btn',
                'hint-btn'
            );
        }

        if (document.getElementById('listen-task-module')) {
            listenTaskModule = new ListenTaskModule(
                'listen-task-module',
                'play-audio-btn',
                'listen-task-text',
                'listen-user-input',
                'listen-check-btn'
            );
        }

        if (document.getElementById('listen-select-module')) {
            listenSelectTaskModule = new ListenSelectTaskModule(
                'listen-select-module'
            );
        }

        if (document.getElementById('translate-task-module')) {
            translateTaskModule = new TranslateTaskModule(
                'translate-task-module'
            );
        }

                        if (document.getElementById('check-btn')) {
            document.getElementById('check-btn').onclick = async () => {
                if (answerTransitionInProgress || !taskModule) return;
                const isCorrect = taskModule.checkAnswer();
                if (isCorrect) {
                    answerTransitionInProgress = true;
                    if (previousIncorrect) {
                        correctAfterIncorrect++;
                        previousIncorrect = false;
                    } else {
                        correctAnswers++;
                    }
                    displayFeedback('Правильно!', taskModule.correctAnswer, true);
                    playCorrectAnswer(taskModule.correctAnswer);
                    document.getElementById('task-module-container').classList.add('hidden');
                    // Добавляем обновление статистики
                    updateStats();
                    saveProgress(currentIndex + 1);
                    setTimeout(async () => {
                        currentIndex++;
                        if (currentIndex < values.length) {
                            document.getElementById('feedback').classList.add('hidden');
                            document.getElementById('correct-answer').classList.add('hidden');
                            await loadQuestion(currentIndex, sheetName);
                        } else {
                            completeModule();
                        }
                    }, 3000);
                } else {
                    incorrectAnswers++;
                    previousIncorrect = true;
                    taskModule.errorCount++;
                    console.log('Error count after increment:', taskModule.errorCount);
                    displayFeedback('Відповідь неправильна 😕, спробуйте ще раз.', '', false);
                    playWrongSound();
                    if (taskModule.errorCount >= ERROR_COUNT_ANSWER) {
                        taskModule.showHintText();
                    }
                    updateProgressBar();
                    updateStats();
                    saveProgress(currentIndex);
                }
            };
        }

        if (document.getElementById('listen-check-btn')) {
            document.getElementById('listen-check-btn').onclick = async () => {
                if (answerTransitionInProgress || !listenTaskModule) return;
                const isCorrect = listenTaskModule.checkAnswer();
                if (isCorrect) {
                    answerTransitionInProgress = true;
                    if (previousIncorrect) {
                        correctAfterIncorrect++;
                        previousIncorrect = false;
                    } else {
                        correctAnswers++;
                    }
                    displayFeedback('Правильно!', listenTaskModule.correctAnswer, true);
                    listenTaskModule.playCorrectSound();
                    document.getElementById('listen-task-module').classList.add('hidden');
                    setTimeout(async () => {
                        currentIndex++;
                        if (currentIndex < values.length) {
                            document.getElementById('feedback').classList.add('hidden');
                            document.getElementById('correct-answer').classList.add('hidden');
                            document.getElementById('listen-task-module').classList.remove('hidden');
                            await loadQuestion(currentIndex, sheetName);
                        } else {
                            completeModule();
                        }
                    }, 3000);
                } else {
                    incorrectAnswers++;
                    previousIncorrect = true;
                    displayFeedback('Відповідь неправильна😕, спробуйте ще раз.', '', false);
                    playWrongSound();
                }
                updateProgressBar();
                updateStats();
                saveProgress(isCorrect ? currentIndex + 1 : currentIndex);
            };
        }

        // Обработчик загрузки страницы
        window.onload = () => {
            fetchAdminData();
            
            const savedUserName = localStorage.getItem('userName');
            if (savedUserName) {
                userName = savedUserName;
                applyTheme(getSavedTheme(userName));
                document.querySelector('.user-info').classList.remove('hidden');
                document.querySelector('.burger-menu').classList.remove('hidden');
                document.getElementById('name-input-container').style.display = 'none';
                document.querySelector('.separator').classList.remove('hidden');
                fetchUserSheet(); // Это установит правильное приветствие из листа
            }
        };

        // Обработчик клика на оверлей
        document.querySelector('.overlay').onclick = hideNotification;

        // Обработчик клика на бургер-меню
        document.querySelector('.burger-icon').addEventListener('click', function() {
            document.querySelector('.side-panel').style.width = '85%';
        });

        // Обработчик клика на кнопку закрытия боковой панели
        document.querySelector('.side-panel .close-btn').addEventListener('click', function() {
            document.querySelector('.side-panel').style.width = '0';
        });
    });
</script>

</body>
</html>
