<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech Synthesis Tester</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2em auto;
        }
        label {
            display: block;
            margin-top: 1em;
        }
        input[type="range"] {
            width: 100%;
        }
    </style>
</head>
<body>
    <h1>Speech Synthesis Tester</h1>

    <label>
        Text to speak:
        <textarea id="text" rows="3" style="width: 100%;">we didn't travel to kyiv last summer</textarea>
    </label>

    <label>
        Voice:
        <select id="voiceSelect"></select>
    </label>

    <label>
        Rate: <span id="rateVal">1</span>
        <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
    </label>

    <label>
        Pitch: <span id="pitchVal">1</span>
        <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
    </label>

    <label>
        Volume: <span id="volumeVal">1</span>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
    </label>

    <button id="speakBtn" style="margin-top: 1em;">Speak</button>

    <script>
        const voiceSelect = document.getElementById('voiceSelect');
const speakBtn = document.getElementById('speakBtn');
const rate = document.getElementById('rate');
const pitch = document.getElementById('pitch');
const volume = document.getElementById('volume');
const rateVal = document.getElementById('rateVal');
const pitchVal = document.getElementById('pitchVal');
const volumeVal = document.getElementById('volumeVal');
const textInput = document.getElementById('text');
let voices = [];

function populateVoices() {
    voices = speechSynthesis.getVoices();
    
    // Проверка, загрузились ли голоса
    if (voices.length === 0) {
        // На Android может потребоваться дополнительная проверка
        setTimeout(populateVoices, 1000);
        return;
    }
    
    // Оставляем только en-GB и en-US, если они есть
    const filteredVoices = voices.filter(voice =>
        voice.lang === 'en-GB' || voice.lang === 'en-US'
    );
    
    // Если нет голосов с нужными языками, покажем все доступные
    const voicesToShow = filteredVoices.length > 0 ? filteredVoices : voices;
    
    voiceSelect.innerHTML = '';
    voicesToShow.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = voices.indexOf(voice); // сохраняем индекс из общего массива
        option.textContent = `${voice.name} (${voice.lang})${voice.default ? ' [default]' : ''}`;
        voiceSelect.appendChild(option);
    });
    
    // Если есть хотя бы один голос, разблокируем кнопку
    if (voicesToShow.length > 0) {
        speakBtn.disabled = false;
    }
}

// Настраиваем первоначальное состояние кнопки
speakBtn.disabled = true;

// Основные обработчики событий
speechSynthesis.onvoiceschanged = populateVoices;

// Дополнительный запуск через таймаут для Android
setTimeout(populateVoices, 500);

speakBtn.addEventListener('click', () => {
    const utterance = new SpeechSynthesisUtterance(textInput.value);
    const selectedVoice = voices[voiceSelect.value];
    if (selectedVoice) {
        utterance.voice = selectedVoice;
    }
    utterance.rate = parseFloat(rate.value);
    utterance.pitch = parseFloat(pitch.value);
    utterance.volume = parseFloat(volume.value);
    speechSynthesis.cancel(); // Остановить предыдущие произношения
    speechSynthesis.speak(utterance);
});

rate.addEventListener('input', () => rateVal.textContent = rate.value);
pitch.addEventListener('input', () => pitchVal.textContent = pitch.value);
volume.addEventListener('input', () => volumeVal.textContent = volume.value);

// Принудительно запускаем загрузку голосов
populateVoices();
    </script>
</body>
</html>
